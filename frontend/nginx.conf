map $http_cf_connecting_ip $forwarded_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $backend_forwarded_proto {
    default     $scheme;
    ~*^https    https;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # O backend aceita imagens de até 25 MB; há margem para o multipart.
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';" always;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_client_ip;
        # Preserva HTTPS informado pelo Cloudflare Tunnel; no acesso local, usa o esquema local.
        proxy_set_header X-Forwarded-Proto $backend_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:5000/health;
        proxy_set_header Host $host;
    }

    location /assets/ {
        # O pdf.js publica o worker como ES module (.mjs). Algumas imagens do
        # Nginx não possuem essa extensão no mime.types padrão e o navegador
        # bloqueia o worker quando ele chega como application/octet-stream.
        include /etc/nginx/mime.types;
        types {
            application/javascript mjs;
        }
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O service worker e o manifesto sempre precisam ser revalidados. Os
    # demais assets possuem nome versionado e são cacheados pelo próprio PWA.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
