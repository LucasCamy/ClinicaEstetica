name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/PainelEstetica.sln --configfile backend/nuget.config

      - name: Verify formatting
        run: dotnet format backend/PainelEstetica.sln --no-restore --verify-no-changes

      - name: Test
        run: dotnet test backend/PainelEstetica.sln --configuration Release --no-restore

      - name: Restore local tools
        working-directory: backend
        run: dotnet tool restore --configfile nuget.config

      - name: Verify EF migration snapshot
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=model_check;Username=model_check;Password=model_check
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/Infrastructure/PainelEstetica.Infrastructure.csproj --startup-project src/WebAPI/WebAPI.csproj --context EsteticaDbContext --configuration Release --no-build

      - name: Audit packages
        run: dotnet list backend/PainelEstetica.sln package --vulnerable --include-transitive

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build and typecheck
        run: npm run build

      - name: Audit packages
        run: npm audit --audit-level=high

  containers:
    name: Containers
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      ADMIN_BOOTSTRAP_USERNAME: ci-admin
      ADMIN_BOOTSTRAP_EMAIL: ci-admin@example.invalid
      ADMIN_BOOTSTRAP_PASSWORD: CI-password-2026-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build
